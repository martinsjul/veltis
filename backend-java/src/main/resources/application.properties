spring.application.name=veltis

# ---------------------------------------------------------------- Banco H2
# Banco em memória: é criado ao iniciar a aplicação e apagado ao parar.
# Os dados de demonstração são carregados pela classe DadosIniciais (pasta seed).
spring.datasource.url=jdbc:h2:mem:veltis;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 para ver as tabelas: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:veltis   usuário: sa   senha: (vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------- JPA / Hibernate
# O Hibernate cria as tabelas a partir das entidades (@Entity).
spring.jpa.hibernate.ddl-auto=create-drop
# Mostra o SQL gerado no console (deixe true para estudar as consultas).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# As consultas acontecem dentro dos services (@Transactional), não na hora de gerar o JSON.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ---------------------------------------------------------------- Dados iniciais
# true = carrega os dados reais da RMS (src/main/resources/seed) ao iniciar.
veltis.seed.ativo=true

# ---------------------------------------------------------------- API
server.port=8080
# Endereços do frontend que podem chamar a API pelo navegador (CORS).
veltis.cors.origens=http://localhost:5173,http://localhost:3000

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
